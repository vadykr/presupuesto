<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <script>
      // Presupuesto: escala de la interfaz en el móvil (Ajustes → Tamaño).
      // Se dibuja la página con más ancho lógico y el navegador la reduce:
      // todo (letra, márgenes, alturas) baja en la misma proporción.
      (function () {
        try {
          var e = parseFloat(
            localStorage.getItem('presupuesto:escala') || '0.7',
          );
          var w = Math.min(screen.width, screen.height);
          if (!(e > 0.4 && e < 1) || w > 700) return;
          window.__presupuestoEscala = e;
          var m = document.querySelector('meta[name=viewport]');
          m.setAttribute(
            'content',
            'width=' +
              Math.round(w / e) +
              ', initial-scale=' +
              e +
              ', minimum-scale=' +
              e +
              ', maximum-scale=' +
              e +
              ', user-scalable=no, viewport-fit=cover',
          );
        } catch (_) {}
      })();
    </script>
    <title>Rumbo Finanzas</title>
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link
      rel="manifest"
      href="/site.webmanifest"
      crossorigin="use-credentials"
    />
    <meta name="msapplication-TileColor" content="#5c3dbb" />
    <meta name="theme-color" content="#5c3dbb" />

    <style type="text/css">
      /* Manrope (OFL 1.1, autoalojada en public/fonts/manrope). La usan los
         temas «Presupuesto» vía --font-family; ver docs-vadym/diseno.md. */
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/manrope/manrope-latin-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/manrope/manrope-latin-ext-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-size: 13px;
      }

      html,
      body,
      button,
      input {
        font-family: var(
          --font-family,
          'Inter Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          'Helvetica',
          'Arial',
          sans-serif
        );
      }

      a {
        color: inherit;
        text-decoration-skip: ink;
      }

      * {
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
      }

      *:focus {
        /* colors.b5 */
        outline-color: #2b8fed;
      }

      /* recharts makes chart surfaces and layers focusable for keyboard
         navigation; suppress the focus ring it would draw on click */
      .recharts-wrapper:focus,
      .recharts-wrapper :focus,
      .recharts-surface:focus,
      .recharts-surface :focus {
        outline: none;
      }

      input,
      textarea {
        font-size: 1em;
        font-family: var(
          --font-family,
          'Inter Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Roboto',
          'Oxygen',
          'Ubuntu',
          'Cantarell',
          'Fira Sans',
          'Droid Sans',
          'Helvetica Neue',
          'Helvetica',
          'Arial',
          sans-serif
        );
        font-feature-settings:
          'ss01',
          'ss04',
          'calt' 0;
      }

      html,
      body,
      #root {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      /* Presupuesto: la app ocupa siempre lo visible. Con alto 100% el
         móvil (Samsung Internet) deja un hueco abajo al esconder sus barras;
         anclada a la ventana crece y encoge con ellas. */
      /* Sin el resaltado azul del navegador al tocar filas y grupos. */
      #root {
        -webkit-tap-highlight-color: transparent;
      }
      [role='grid'],
      [role='row'] {
        -webkit-user-select: none;
        user-select: none;
        outline: none;
      }
      /* Presupuesto: en pantallas anchas (PC) la app se ve como en el móvil,
         en una columna centrada de 480 px (useResponsive mide esa columna).
         El transform hace que lo fijo (teclado, hojas, avisos) quede dentro
         de la columna; solo en pantallas anchas, nunca en el móvil. */
      @media (min-width: 600px) {
        html {
          background: #d9dde4;
        }
        body {
          max-width: 480px;
          margin: 0 auto;
          transform: translateZ(0);
          box-shadow: 0 0 48px rgba(15, 23, 42, 0.18);
        }
      }
      @media (min-width: 600px) and (prefers-color-scheme: dark) {
        html {
          background: #05070a;
        }
      }
      #root {
        position: fixed;
        inset: 0;
        height: auto;
      }

      .cm-theme-dark {
        height: 100%;
      }

      .cm-theme-light {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
